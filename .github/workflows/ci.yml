name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check app tests scripts

      - name: Test with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Versioned eval gate
        run: python scripts/run_evals.py
